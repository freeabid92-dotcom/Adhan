name: adhan_app
description: تطبيق مواقيت الأذان والقرآن والأذكار واتجاه القبلة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  adhan: ^2.0.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_qiblah: ^3.0.0
  audioplayers: ^6.0.0
  just_audio: ^0.9.40
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  workmanager: ^0.5.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  easy_localization: ^3.0.7
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/quran/
    - assets/icons/
    - assets/localization/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: TajweedFont
      fonts:
        - asset: assets/fonts/QuranTajweed.ttf
    - family: IndoPak
      fonts:
        - asset: assets/fonts/IndoPak.ttf
